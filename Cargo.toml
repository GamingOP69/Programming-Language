[workspace]
resolver = "2"
members = [
    "crates/samrat-cli",
    "crates/samrat-lexer",
    "crates/samrat-parser",
    "crates/samrat-semantic",
    "crates/samrat-ir",
    "crates/samrat-codegen",
    "crates/samrat-runtime",
    "crates/samrat-stdlib",
    "crates/samrat-pkg",
    "crates/samrat-debug",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["Samrat Language Team"]
